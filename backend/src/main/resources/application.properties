spring.application.name=backend


# SQLite
sqlite.datasource.url=jdbc:sqlite:database/metadata_graph.db
sqlite.datasource.driver-class-name=org.sqlite.JDBC

# Postgres
postgres.datasource.driver-class-name=org.postgresql.Driver
postgres.datasource.url=jdbc:postgresql://localhost:5432/kolkata_metro
# postgres.datasource.username=postgres
# postgres.datasource.password=******

postgres.datasource.username=${POSTGRES_USERNAME}
postgres.datasource.password=${POSTGRES_PASSWORD}


spring.jpa.show-sql=true

# Server
server.port=8080
debug=true

